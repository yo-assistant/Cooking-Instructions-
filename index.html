<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飯捲店備料與出攤流程助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 h-full flex flex-col antialiased">

    <header class="bg-amber-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🍙</span>
                <div>
                    <h1 class="text-lg font-bold leading-tight">飯捲店備料與出攤助手</h1>
                    <div class="flex items-center gap-2">
                        <p class="text-xs text-amber-100" id="current-date-display">載入日期中...</p>
                        <span id="sync-status" class="text-[10px] bg-amber-700 px-1.5 py-0.5 rounded text-amber-200">雲端同步就緒</span>
                    </div>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="exportBackupData()" class="px-2.5 py-1.5 bg-amber-700 hover:bg-amber-800 text-white text-xs font-medium rounded-lg transition shadow-sm flex items-center gap-1 cursor-pointer" title="匯出所有資料備份">
                    💾 匯出備份
                </button>
                <label class="px-2.5 py-1.5 bg-amber-700 hover:bg-amber-800 text-white text-xs font-medium rounded-lg transition shadow-sm flex items-center gap-1 cursor-pointer" title="載入或還原備份資料">
                    📂 載入備份
                    <input type="file" id="backup-file-input" accept=".json" class="hidden" onchange="importBackupData(event)">
                </label>
                <div class="h-4 w-[1px] bg-amber-500 mx-1"></div>
                <button onclick="switchTab('execution')" id="tab-execution" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-amber-700 text-white transition shadow-sm">
                    🚀 今日執行
                </button>
                <button onclick="switchTab('templates')" id="tab-templates" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-amber-500/80 hover:bg-amber-500 text-white transition">
                    ⚙️ 步驟設定
                </button>
            </div>
        </div>
    </header>

    <!-- GitHub Deployment Help Banner -->
    <div class="bg-amber-100 border-b border-amber-200 px-4 py-2 text-xs text-amber-900 flex justify-between items-center">
        <span>💡 <b>提示：</b>將此單一 HTML 檔案上傳到 GitHub 後，若想產生網址分享給平板使用，請開啟 GitHub 倉庫的 <b>Settings > Pages</b>，將 Source 設為 <b>main / root</b> 即可取得 GitHub Pages 網址！</span>
    </div>

    <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-6 overflow-y-auto pb-24">
        
        <!-- ================= EXECUTION VIEW ================= -->
        <div id="view-execution" class="space-y-4">
            
            <!-- Date & Timer Bar -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-amber-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">選擇工作日期:</label>
                        <input type="date" id="exec-date-picker" onchange="changeExecDate(this.value)" class="bg-amber-50 border border-amber-300 rounded-lg px-3 py-1.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div class="flex-1 md:flex-initial">
                        <label class="block text-xs font-semibold text-slate-500 mb-1">整體進度:</label>
                        <div class="flex items-center gap-2">
                            <div class="w-32 sm:w-48 bg-slate-200 rounded-full h-3 overflow-hidden">
                                <div id="overall-progress-bar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
                            </div>
                            <span id="overall-progress-text" class="text-xs font-bold text-slate-600">0%</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                    <button onclick="resetExecutionProgress()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs rounded-lg font-medium transition">
                        🔄 重置今日進度
                    </button>
                    <button onclick="toggleActiveTimersDrawer()" class="relative px-3 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs rounded-lg font-medium transition flex items-center gap-1">
                        ⏱️ 進行中計時器 <span id="active-timer-badge" class="bg-amber-600 text-white rounded-full px-1.5 py-0.2 text-[10px] hidden">0</span>
                    </button>
                </div>
            </div>

            <!-- Active Timers Floating / Top Bar -->
            <div id="timers-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                <!-- Dynamic Active Timers injected here -->
            </div>

            <!-- Steps List -->
            <div class="bg-white rounded-2xl shadow-sm border border-amber-200 overflow-hidden">
                <div class="bg-amber-100/60 px-4 py-3 border-b border-amber-200 flex justify-between items-center">
                    <h2 class="font-bold text-amber-900 flex items-center gap-2 text-base">
                        <span>📋</span> 備料與出攤步驟清單
                    </h2>
                    <span id="step-counter-badge" class="text-xs bg-amber-200 text-amber-800 px-2 py-1 rounded-full font-semibold">完成 0 / 0</span>
                </div>
                <div id="execution-steps-list" class="divide-y divide-slate-100">
                    <!-- Dynamic Execution Steps injected here -->
                </div>
            </div>
        </div>

        <!-- ================= TEMPLATES VIEW ================= -->
        <div id="view-templates" class="space-y-4 hidden">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-amber-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">步驟模板管理</h2>
                    <p class="text-xs text-slate-500">在這裡設定您的標準備料與出攤步驟。變更會自動儲存至雲端。</p>
                </div>
                <div class="flex gap-2 w-full sm:w-auto">
                    <button onclick="openStepModal()" class="flex-1 sm:flex-none px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-sm font-semibold rounded-xl shadow transition flex items-center justify-center gap-1">
                        ➕ 新增步驟
                    </button>
                    <button onclick="loadDefaultTemplate()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-xl transition">
                        載入飯捲店範例
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-amber-200 overflow-hidden">
                <div id="template-steps-list" class="divide-y divide-slate-100">
                    <!-- Dynamic Template Steps injected here -->
                </div>
            </div>
        </div>

    </main>

    <!-- Add/Edit Step Modal -->
    <div id="step-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4 border border-amber-100">
            <div class="flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">新增步驟</h3>
                <button onclick="closeStepModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <form id="step-form" onsubmit="saveStep(event)" class="space-y-4">
                <input type="hidden" id="modal-step-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">步驟名稱 / 任務內容 *</label>
                    <input type="text" id="modal-step-title" required placeholder="例如：煮好壽司飯 / 備好紅蘿蔔絲" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">分類標籤</label>
                        <select id="modal-step-category" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <option value="前置備料">前置備料</option>
                            <option value="食材烹煮">食材烹煮</option>
                            <option value="攤位組裝">攤位組裝</option>
                            <option value="開攤準備">開攤準備</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">計時倒數 (分鐘)</label>
                        <input type="number" id="modal-step-timer" min="0" step="0.5" placeholder="0 表示無計時" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">詳細備註或提醒 (選填)</label>
                    <textarea id="modal-step-notes" rows="2" placeholder="例如：水滾後下料，計時10分鐘記得關火..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeStepModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-medium">取消</button>
                    <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-sm font-semibold shadow">儲存步驟</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Timer Alert Modal -->
    <div id="timer-alert-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden animate-pulse">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4 border-4 border-amber-500">
            <div class="text-6xl animate-bounce">⏰</div>
            <h3 class="text-xl font-black text-amber-900" id="alert-title">計時倒數完成！</h3>
            <p class="text-sm text-slate-600 font-medium" id="alert-message">您的計時器已結束，請立即檢查對應動作！</p>
            <button onclick="dismissTimerAlert()" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl text-base shadow-lg transition">
                知道了，關閉提醒
            </button>
        </div>
    </div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Default Kimbap Shop Steps Template
        const defaultSteps = [
            { id: '1', title: '洗米並煮壽司飯', category: '前置備料', timerMinutes: 30, notes: '水量比例抓好，電鍋跳起後悶15分鐘。' },
            { id: '2', title: '川燙菠菜並調味', category: '食材烹煮', timerMinutes: 3, notes: '水滾下鍋3分鐘撈起，迅速過冷水榨乾拌麻油鹽。' },
            { id: '3', title: '煮水準備川燙肉片/火腿', category: '食材烹煮', timerMinutes: 10, notes: '大火煮滾10分鐘後轉小火或關火備用。' },
            { id: '4', title: '煎蛋皮並切絲', category: '食材烹煮', timerMinutes: 5, notes: '小火慢煎兩面金黃，放涼後切細絲。' },
            { id: '5', title: '準備醃蘿蔔與黃瓜條', category: '前置備料', timerMinutes: 0, notes: '切好一致長度與厚度方便包捲。' },
            { id: '6', title: '調製飯捲靈魂壽司醋醬', category: '前置備料', timerMinutes: 0, notes: '白醋、糖、鹽按比例加熱融化拌入飯中。' },
            { id: '7', title: '攤位工具與竹簾消毒就定位', category: '攤位組裝', timerMinutes: 0, notes: '手套、海苔、包材、手水碗備齊。' },
            { id: '8', title: '最後出攤開賣準備完成', category: '開攤準備', timerMinutes: 0, notes: '準備迎接客人！' }
        ];

        // Global State
        let templates = [];
        let activeExecDate = getTodayDateString();
        let executionData = {}; // stepId -> { completed: boolean }
        let activeTimers = JSON.parse(localStorage.getItem('kimbap_active_timers')) || [];
        let audioCtx = null;

        // Firebase Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kimbap-shop-default-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        let app, db, auth, userId;
        
        window.onload = async function() {
            document.getElementById('exec-date-picker').value = activeExecDate;
            updateDateDisplay();

            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                userId = auth.currentUser?.uid || crypto.randomUUID();
                document.getElementById('sync-status').innerText = '雲端同步已連線';
                document.getElementById('sync-status').className = 'text-[10px] bg-emerald-700 px-1.5 py-0.5 rounded text-emerald-100';

                // Initialize Listeners
                initTemplatesListener();
                initExecutionListener();

            } catch (e) {
                console.warn('Firebase initialization fallback to local mode:', e);
                document.getElementById('sync-status').innerText = '本機儲存模式';
                document.getElementById('sync-status').className = 'text-[10px] bg-amber-800 px-1.5 py-0.5 rounded text-amber-200';
                
                // Fallback to localStorage
                templates = JSON.parse(localStorage.getItem('kimbap_templates')) || defaultSteps;
                loadExecutionDataLocal();
                renderTemplatesView();
                renderExecutionView();
            }

            // Start Timer Tick
            setInterval(timerTick, 1000);
        };

        // --- FIREBASE SYNC FUNCTIONS ---
        function initTemplatesListener() {
            if (!db || !userId) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'kimbap_templates_doc');
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().steps) {
                    templates = docSnap.data().steps;
                } else {
                    templates = defaultSteps;
                    saveTemplatesCloud(); // Save defaults if empty
                }
                renderTemplatesView();
                renderExecutionView();
            }, (err) => {
                console.error("Template sync error:", err);
            });
        }

        async function saveTemplatesCloud() {
            if (!db || !userId) {
                localStorage.setItem('kimbap_templates', JSON.stringify(templates));
                return;
            }
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'kimbap_templates_doc');
                await setDoc(docRef, { steps: templates });
            } catch (e) {
                console.error("Error saving templates:", e);
            }
        }

        function initExecutionListener() {
            if (!db || !userId) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'kimbap_exec_' + activeExecDate);
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().data) {
                    executionData = docSnap.data().data;
                } else {
                    executionData = {};
                }
                renderExecutionView();
            }, (err) => {
                console.error("Execution data sync error:", err);
            });
        }

        async function saveExecutionCloud() {
            if (!db || !userId) {
                localStorage.setItem('kimbap_exec_' + activeExecDate, JSON.stringify(executionData));
                return;
            }
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'kimbap_exec_' + activeExecDate);
                await setDoc(docRef, { data: executionData });
            } catch (e) {
                console.error("Error saving execution data:", e);
            }
        }

        function loadExecutionDataLocal() {
            const saved = localStorage.getItem('kimbap_exec_' + activeExecDate);
            executionData = saved ? JSON.parse(saved) : {};
        }

        // --- UTILS & DATE ---
        function getTodayDateString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function updateDateDisplay() {
            const dObj = new Date(activeExecDate);
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('current-date-display').innerText = `工作日期：${dObj.toLocaleDateString('zh-TW', options)}`;
        }

        window.changeExecDate = function(newDate) {
            if(!newDate) return;
            activeExecDate = newDate;
            updateDateDisplay();
            if (db && userId) {
                initExecutionListener();
            } else {
                loadExecutionDataLocal();
                renderExecutionView();
            }
        }

        // --- AUDIO BEEP ---
        function playBeep() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            } catch(e) {
                console.log('Audio context error:', e);
            }
        }

        // --- TAB SWITCHING ---
        window.switchTab = function(tabName) {
            const execView = document.getElementById('view-execution');
            const tempView = document.getElementById('view-templates');
            const execBtn = document.getElementById('tab-execution');
            const tempBtn = document.getElementById('tab-templates');

            if (tabName === 'execution') {
                execView.classList.remove('hidden');
                tempView.classList.add('hidden');
                execBtn.className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-amber-700 text-white transition shadow-sm";
                tempBtn.className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-amber-500/80 hover:bg-amber-500 text-white transition";
                renderExecutionView();
            } else {
                execView.classList.add('hidden');
                tempView.classList.remove('hidden');
                tempBtn.className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-amber-700 text-white transition shadow-sm";
                execBtn.className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-amber-500/80 hover:bg-amber-500 text-white transition";
                renderTemplatesView();
            }
        }

        // --- TEMPLATE RENDERING & EDITING ---
        window.loadDefaultTemplate = function() {
            if (confirm('確定要載入預設飯捲店步驟範例嗎？這將覆蓋您目前的步驟設定。')) {
                templates = JSON.parse(JSON.stringify(defaultSteps));
                saveTemplatesCloud();
                renderTemplatesView();
            }
        }

        // Helper for category badge colors
        function getCategoryBadgeClass(category) {
            switch(category) {
                case '前置備料':
                    return 'bg-blue-100 text-blue-800 border border-blue-200';
                case '食材烹煮':
                    return 'bg-orange-100 text-orange-800 border border-orange-200';
                case '攤位組裝':
                    return 'bg-purple-100 text-purple-800 border border-purple-200';
                case '開攤準備':
                    return 'bg-emerald-100 text-emerald-800 border border-emerald-200';
                default:
                    return 'bg-amber-100 text-amber-800 border border-amber-200';
            }
        }

        function renderTemplatesView() {
            const listContainer = document.getElementById('template-steps-list');
            if (!templates || templates.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">目前尚無設定步驟，請點擊上方「新增步驟」或「載入範例」。</div>`;
                return;
            }

            let html = '';
            templates.forEach((step, index) => {
                const timerBadge = step.timerMinutes > 0 ? `<span class="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded-full font-medium">⏱️ ${step.timerMinutes} 分鐘倒數</span>` : '';
                const catClass = getCategoryBadgeClass(step.category);
                html += `
                    <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-amber-50/40 transition">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded font-bold">#${index + 1}</span>
                                <span class="${catClass} text-xs px-2 py-0.5 rounded font-medium">${step.category || '一般'}</span>
                                <h3 class="font-bold text-slate-800 text-base">${escapeHtml(step.title)}</h3>
                                ${timerBadge}
                            </div>
                            ${step.notes ? `<p class="text-xs text-slate-500 pl-6">${escapeHtml(step.notes)}</p>` : ''}
                        </div>
                        <div class="flex items-center gap-2 self-end sm:self-center">
                            <button onclick="moveStepOrder('${step.id}', -1)" ${index === 0 ? 'disabled class="opacity-30 cursor-not-allowed p-1 text-slate-400"' : 'class="p-1 text-slate-600 hover:bg-slate-100 rounded"'}>⬆️</button>
                            <button onclick="moveStepOrder('${step.id}', 1)" ${index === templates.length - 1 ? 'disabled class="opacity-30 cursor-not-allowed p-1 text-slate-400"' : 'class="p-1 text-slate-600 hover:bg-slate-100 rounded"'}>⬇️</button>
                            <button onclick="editStep('${step.id}')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium">編輯</button>
                            <button onclick="deleteStep('${step.id}')" class="px-3 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-medium">刪除</button>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        window.openStepModal = function(stepId = null) {
            document.getElementById('step-modal').classList.remove('hidden');
            if (stepId) {
                document.getElementById('modal-title').innerText = '編輯步驟';
                const step = templates.find(s => s.id === stepId);
                if (step) {
                    document.getElementById('modal-step-id').value = step.id;
                    document.getElementById('modal-step-title').value = step.title;
                    document.getElementById('modal-step-category').value = step.category || '前置備料';
                    document.getElementById('modal-step-timer').value = step.timerMinutes || 0;
                    document.getElementById('modal-step-notes').value = step.notes || '';
                }
            } else {
                document.getElementById('modal-title').innerText = '新增步驟';
                document.getElementById('step-form').reset();
                document.getElementById('modal-step-id').value = '';
                document.getElementById('modal-step-timer').value = '0';
            }
        }

        window.closeStepModal = function() {
            document.getElementById('step-modal').classList.add('hidden');
        }

        window.saveStep = function(e) {
            e.preventDefault();
            const id = document.getElementById('modal-step-id').value;
            const title = document.getElementById('modal-step-title').value.trim();
            const category = document.getElementById('modal-step-category').value;
            const timerMinutes = parseFloat(document.getElementById('modal-step-timer').value) || 0;
            const notes = document.getElementById('modal-step-notes').value.trim();

            if (!title) return;

            if (id) {
                const index = templates.findIndex(s => s.id === id);
                if (index !== -1) {
                    templates[index] = { id, title, category, timerMinutes, notes };
                }
            } else {
                const newId = Date.now().toString();
                templates.push({ id: newId, title, category, timerMinutes, notes });
            }

            saveTemplatesCloud();
            closeStepModal();
            renderTemplatesView();
        }

        window.editStep = function(id) {
            openStepModal(id);
        }

        window.deleteStep = function(id) {
            if (confirm('確定要刪除這個步驟嗎？')) {
                templates = templates.filter(s => s.id !== id);
                saveTemplatesCloud();
                renderTemplatesView();
            }
        }

        window.moveStepOrder = function(id, direction) {
            const index = templates.findIndex(s => s.id === id);
            if (index === -1) return;
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= templates.length) return;
            
            const temp = templates[index];
            templates[index] = templates[targetIndex];
            templates[targetIndex] = temp;

            saveTemplatesCloud();
            renderTemplatesView();
        }

        // --- EXECUTION RENDERING & TIMERS ---
        function renderExecutionView() {
            const listContainer = document.getElementById('execution-steps-list');
            if (!templates || templates.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">尚未設定任何步驟，請先至「步驟設定」新增或載入範例。</div>`;
                document.getElementById('overall-progress-bar').style.width = '0%';
                document.getElementById('overall-progress-text').innerText = '0%';
                document.getElementById('step-counter-badge').innerText = '完成 0 / 0';
                return;
            }

            let completedCount = 0;
            let html = '';

            templates.forEach((step, index) => {
                const isCompleted = executionData[step.id] && executionData[step.id].completed;
                if (isCompleted) completedCount++;

                const timerMinutes = step.timerMinutes || 0;
                let timerBtnHtml = '';
                if (timerMinutes > 0) {
                    const existingTimer = activeTimers.find(t => t.stepId === step.id);
                    if (existingTimer) {
                        timerBtnHtml = `<span class="px-2.5 py-1 bg-amber-500 text-white rounded-lg text-xs font-bold animate-pulse flex items-center gap-1">⏱️ 計時中 (${formatTime(existingTimer.remainingSeconds)})</span>`;
                    } else {
                        timerBtnHtml = `<button onclick="startStepTimer('${step.id}', ${timerMinutes}, '${escapeHtml(step.title)}')" class="px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg text-xs font-semibold transition flex items-center gap-1">⏱️ 啟動計時 (${timerMinutes}分)</button>`;
                    }
                }

                const catClass = getCategoryBadgeClass(step.category);

                html += `
                    <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 transition ${isCompleted ? 'bg-emerald-50/50 opacity-75' : 'hover:bg-amber-50/30'}">
                        <div class="flex items-start gap-3">
                            <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleStepComplete('${step.id}')" class="mt-1 w-5 h-5 text-emerald-600 rounded focus:ring-emerald-500 cursor-pointer">
                            <div class="space-y-1">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="text-xs font-bold text-slate-400">#${index + 1}</span>
                                    <span class="${catClass} text-[11px] px-2 py-0.5 rounded font-medium">${step.category || '一般'}</span>
                                    <h3 class="font-bold text-slate-800 text-base ${isCompleted ? 'line-through text-slate-400' : ''}">${escapeHtml(step.title)}</h3>
                                </div>
                                ${step.notes ? `<p class="text-xs text-slate-500">${escapeHtml(step.notes)}</p>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-2 self-end sm:self-center pl-8 sm:pl-0">
                            ${timerBtnHtml}
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;

            const total = templates.length;
            const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;
            document.getElementById('overall-progress-bar').style.width = percent + '%';
            document.getElementById('overall-progress-text').innerText = percent + '%';
            document.getElementById('step-counter-badge').innerText = `完成 ${completedCount} / ${total}`;

            renderActiveTimersBar();
        }

        window.toggleStepComplete = function(stepId) {
            if (!executionData[stepId]) {
                executionData[stepId] = {};
            }
            executionData[stepId].completed = !executionData[stepId].completed;
            saveExecutionCloud();
            renderExecutionView();
        }

        window.resetExecutionProgress = function() {
            if (confirm(`確定要重置 ${activeExecDate} 的所有勾選進度嗎？`)) {
                executionData = {};
                saveExecutionCloud();
                renderExecutionView();
            }
        }

        // --- TIMER ENGINE ---
        function timerTick() {
            if (activeTimers.length === 0) return;

            let updated = false;
            activeTimers = activeTimers.map(timer => {
                if (timer.remainingSeconds > 0) {
                    timer.remainingSeconds--;
                    updated = true;
                }
                return timer;
            });

            const completedTimers = activeTimers.filter(t => t.remainingSeconds === 0);
            activeTimers = activeTimers.filter(t => t.remainingSeconds > 0);

            if (completedTimers.length > 0) {
                localStorage.setItem('kimbap_active_timers', JSON.stringify(activeTimers));
                renderExecutionView();
                triggerTimerAlert(completedTimers.map(t => t.title).join('、'));
            } else if (updated) {
                localStorage.setItem('kimbap_active_timers', JSON.stringify(activeTimers));
                renderActiveTimersBar();
            }
        }

        window.exportBackupData = function() {
            const allStorageData = {
                templates: templates,
                appId: appId,
                exportDate: new Date().toISOString(),
                // Collect any execution date records from localStorage if local mode was used
                executionRecords: {}
            };

            // Gather execution logs stored in localStorage as well
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('kimbap_exec_')) {
                    try {
                        allStorageData.executionRecords[key] = JSON.parse(localStorage.getItem(key));
                    } catch(e) {}
                }
            }
            // Include current active executionData
            allStorageData.executionRecords['kimbap_exec_' + activeExecDate] = executionData;

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allStorageData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `kimbap_shop_backup_${getTodayDateString()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        window.importBackupData = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.templates && Array.isArray(parsed.templates)) {
                        templates = parsed.templates;
                        saveTemplatesCloud();

                        if (parsed.executionRecords) {
                            for (const [key, val] of Object.entries(parsed.executionRecords)) {
                                localStorage.setItem(key, JSON.stringify(val));
                                if (key === 'kimbap_exec_' + activeExecDate) {
                                    executionData = val;
                                }
                            }
                        }

                        renderTemplatesView();
                        renderExecutionView();
                        alert('備份資料載入與還原成功！');
                    } else {
                        alert('備份檔案格式不正確，找不到有效的步驟模板資料。');
                    }
                } catch (err) {
                    console.error(err);
                    alert('解析備份 JSON 檔案失敗，請確認檔案格式是否正確。');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function triggerTimerAlert(titles) {
            playBeep();
            document.getElementById('alert-title').innerText = '⏰ 倒數計時完成！';
            document.getElementById('alert-message').innerText = `步驟「${titles}」的時間已到，請前往確認！`;
            document.getElementById('timer-alert-modal').classList.remove('hidden');
        }

        window.dismissTimerAlert = function() {
            document.getElementById('timer-alert-modal').classList.add('hidden');
        }

        function renderActiveTimersBar() {
            const container = document.getElementById('timers-container');
            const badge = document.getElementById('active-timer-badge');

            if (activeTimers.length === 0) {
                container.innerHTML = '';
                badge.classList.add('hidden');
                return;
            }

            badge.innerText = activeTimers.length;
            badge.classList.remove('hidden');

            let html = '';
            activeTimers.forEach(timer => {
                const progressPct = ((timer.totalSeconds - timer.remainingSeconds) / timer.totalSeconds) * 100;
                html += `
                    <div class="bg-amber-500 text-white rounded-2xl p-3 shadow-md flex items-center justify-between gap-3 relative overflow-hidden">
                        <div class="absolute bottom-0 left-0 h-1 bg-amber-300 transition-all duration-500" style="width: ${progressPct}%"></div>
                        <div class="min-w-0 flex-1">
                            <p class="text-xs text-amber-100 font-medium truncate">倒數中：${escapeHtml(timer.title)}</p>
                            <p class="text-xl font-black font-mono tracking-wider">${formatTime(timer.remainingSeconds)}</p>
                        </div>
                        <button onclick="cancelTimer('${timer.id}')" class="bg-amber-700 hover:bg-amber-800 text-white text-xs px-2.5 py-1.5 rounded-xl font-bold transition shadow-sm">
                            停止
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.toggleActiveTimersDrawer = function() {
            const container = document.getElementById('timers-container');
            container.scrollIntoView({ behavior: 'smooth' });
        }

        function formatTime(totalSec) {
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
