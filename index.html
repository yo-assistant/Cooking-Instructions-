<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飯捲店備料與開攤步驟工具</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-amber-50/50 text-slate-800 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-amber-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-utensils text-xl"></i>
                <h1 class="text-lg font-bold tracking-wider">飯捲店備料與出攤助手</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="exportData()" class="bg-amber-700 hover:bg-amber-800 text-xs px-2.5 py-1.5 rounded-lg transition shadow flex items-center space-x-1 cursor-pointer">
                    <i class="fa-solid fa-download"></i><span>匯出備份</span>
                </button>
                <label class="bg-amber-700 hover:bg-amber-800 text-xs px-2.5 py-1.5 rounded-lg transition shadow flex items-center space-x-1 cursor-pointer">
                    <i class="fa-solid fa-upload"></i><span>匯入備份</span>
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- 頂端常駐計時器面板 (堆疊顯示) -->
    <div id="timers-container" class="bg-amber-900 text-white px-4 py-2 shadow-inner hidden">
        <div class="max-w-4xl mx-auto">
            <div class="text-xs text-amber-300 font-semibold mb-1 flex items-center justify-between">
                <span><i class="fa-solid fa-stopwatch animate-pulse mr-1"></i> 進行中的倒數計時</span>
                <span id="active-timer-count" class="bg-amber-800 px-2 py-0.5 rounded-full text-[10px]">0 個計時中</span>
            </div>
            <div id="running-timers-list" class="flex flex-wrap gap-2"></div>
        </div>
    </div>

    <!-- 主頁籤切換 -->
    <nav class="bg-white border-b border-amber-200 shadow-sm sticky top-[53px] z-30">
        <div class="max-w-4xl mx-auto flex">
            <button onclick="switchTab('execute')" id="tab-execute" class="flex-1 py-3 text-center font-bold text-amber-700 border-b-2 border-amber-600 transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-list-check"></i><span>今日執行與備料</span>
            </button>
            <button onclick="switchTab('templates')" id="tab-templates" class="flex-1 py-3 text-center font-medium text-slate-500 hover:text-amber-700 border-b-2 border-transparent transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-gear"></i><span>步驟與標籤設定</span>
            </button>
        </div>
    </nav>

    <!-- 主內容區 -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full pb-24">
        
        <!-- 執行頁面 -->
        <section id="section-execute" class="space-y-6">
            <!-- 日期與進度卡片 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-amber-100 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="w-full md:w-auto">
                    <label class="block text-xs font-bold text-slate-400 mb-1">選擇工作日期</label>
                    <input type="date" id="work-date" onchange="changeDate()" class="bg-amber-50 border border-amber-200 text-slate-700 text-sm rounded-xl px-3 py-2 font-bold focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div class="w-full md:flex-1 md:max-w-xs">
                    <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
                        <span>今日完成進度</span>
                        <span id="progress-text">0 / 0 (0%)</span>
                    </div>
                    <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-amber-500 h-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <div>
                    <button onclick="resetTodayProgress()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs px-3 py-2 rounded-xl transition font-medium">
                        <i class="fa-solid fa-rotate-right mr-1"></i>重設今日進度
                    </button>
                </div>
            </div>

            <!-- 步驟清單 -->
            <div id="execution-steps-list" class="space-y-3">
                <!-- 動態載入 -->
            </div>
        </section>

        <!-- 設定頁面 -->
        <section id="section-templates" class="space-y-6 hidden">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-amber-100">
                <h2 class="text-base font-bold text-amber-900 mb-4 flex items-center">
                    <i class="fa-solid fa-plus-circle mr-2 text-amber-600"></i>新增標準備料與出攤步驟
                </h2>
                <form onsubmit="addStep(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">步驟名稱</label>
                            <input type="text" id="new-title" required placeholder="例如：煮壽司飯 / 切小黃瓜絲" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">分類標籤</label>
                            <select id="new-category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                                <option value="前置備料">前置備料</option>
                                <option value="食材烹煮">食材烹煮</option>
                                <option value="攤位組裝">攤位組裝</option>
                                <option value="開攤準備">開攤準備</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">附加計時倒數時間 (分鐘，選填)</label>
                            <input type="number" id="new-timer" min="0" placeholder="例如：10 (若不需要填 0 或留空)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">備註說明 (選填)</label>
                            <input type="text" id="new-desc" placeholder="例如：水滾後轉小火計時" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition shadow">
                            新增步驟
                        </button>
                    </div>
                </form>
            </div>

            <!-- 現有步驟範本清單 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-amber-100">
                <h2 class="text-base font-bold text-amber-900 mb-4 flex items-center">
                    <i class="fa-solid fa-list mr-2 text-amber-600"></i>現有步驟管理
                </h2>
                <div id="templates-list" class="space-y-3">
                    <!-- 動態載入 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 時間到提醒彈窗 (Modal) -->
    <div id="alarm-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl animate-bounce">
            <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                <i class="fa-solid fa-bell"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">計時結束！</h3>
            <p id="alarm-message" class="text-slate-600 text-sm mb-6 font-medium">項目時間到，請立即處理！</p>
            <button onclick="dismissAlarm()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl transition shadow">
                我知道了，關閉提示
            </button>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 分類標籤對應的顏色配置
        const categoryColors = {
            '前置備料': 'bg-blue-100 text-blue-700 border-blue-200',
            '食材烹煮': 'bg-amber-100 text-amber-700 border-amber-200',
            '攤位組裝': 'bg-purple-100 text-purple-700 border-purple-200',
            '開攤準備': 'bg-emerald-100 text-emerald-700 border-emerald-200',
            '其他': 'bg-slate-100 text-slate-700 border-slate-200'
        };

        // 預設範本
        const defaultTemplates = [
            { id: '1', title: '準備煮飯用水與洗米', category: '前置備料', timerMinutes: 0, desc: '洗淨瀝乾準備下鍋' },
            { id: '2', title: '按下電鍋煮飯開關', category: '食材烹煮', timerMinutes: 30, desc: '煮飯標準時間' },
            { id: '3', title: '燙菠菜與紅蘿蔔絲', category: '食材烹煮', timerMinutes: 3, desc: '滾水川燙3分鐘後撈起過冷水' },
            { id: '4', title: '煎玉子燒蛋皮', category: '食材烹煮', timerMinutes: 5, desc: '小火慢煎捲起' },
            { id: '5', title: '攤位桌椅與招牌組裝', category: '攤位組裝', timerMinutes: 0, desc: '確認位置與電源' }
        ];

        let templates = JSON.parse(localStorage.getItem('kimbap_templates')) || defaultTemplates;
        let dailyProgress = JSON.parse(localStorage.getItem('kimbap_daily_progress')) || {}; // { 'YYYY-MM-DD': { stepId: boolean } }
        let activeTimers = []; // { id, title, remainingSeconds, totalSeconds }

        // 初始化日期
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('work-date').value = todayStr;

        // 頁籤切換
        function switchTab(tabName) {
            const executeSec = document.getElementById('section-execute');
            const templateSec = document.getElementById('section-templates');
            const tabExBtn = document.getElementById('tab-execute');
            const tabTeBtn = document.getElementById('tab-templates');

            if (tabName === 'execute') {
                executeSec.classList.remove('hidden');
                templateSec.classList.add('hidden');
                tabExBtn.className = "flex-1 py-3 text-center font-bold text-amber-700 border-b-2 border-amber-600 transition flex items-center justify-center space-x-2";
                tabTeBtn.className = "flex-1 py-3 text-center font-medium text-slate-500 hover:text-amber-700 border-b-2 border-transparent transition flex items-center justify-center space-x-2";
                renderExecution();
            } else {
                executeSec.classList.add('hidden');
                templateSec.classList.remove('hidden');
                tabTeBtn.className = "flex-1 py-3 text-center font-bold text-amber-700 border-b-2 border-amber-600 transition flex items-center justify-center space-x-2";
                tabExBtn.className = "flex-1 py-3 text-center font-medium text-slate-500 hover:text-amber-700 border-b-2 border-transparent transition flex items-center justify-center space-x-2";
                renderTemplates();
            }
        }

        function changeDate() {
            renderExecution();
        }

        // 渲染執行頁面
        function renderExecution() {
            const dateVal = document.getElementById('work-date').value;
            const container = document.getElementById('execution-steps-list');
            const progress = dailyProgress[dateVal] || {};

            if (templates.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 bg-white rounded-2xl border border-amber-100">尚無步驟範本，請至上方「步驟與標籤設定」新增！</div>`;
                updateProgress(0, 0);
                return;
            }

            let html = '';
            let completedCount = 0;

            templates.forEach((step, index) => {
                const isChecked = progress[step.id] || false;
                if (isChecked) completedCount++;
                const colorClass = categoryColors[step.category] || categoryColors['其他'];

                html += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border ${isChecked ? 'border-emerald-200 bg-emerald-50/20' : 'border-amber-100'} flex items-center justify-between gap-3 transition">
                        <div class="flex items-center space-x-3 flex-1">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="toggleStep('${step.id}')" class="w-6 h-6 text-amber-600 rounded-lg border-slate-300 focus:ring-amber-500 cursor-pointer">
                            <div>
                                <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-md border ${colorClass}">${step.category}</span>
                                    <h3 class="text-sm font-bold ${isChecked ? 'line-through text-slate-400' : 'text-slate-800'}">${index + 1}. ${step.title}</h3>
                                </div>
                                ${step.desc ? `<p class="text-xs text-slate-500 mt-1">${step.desc}</p>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${step.timerMinutes > 0 ? `
                                <button onclick="startTimer('${step.id}', '${step.title}',${step.timerMinutes})" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-2 rounded-xl font-bold transition flex items-center space-x-1 cursor-pointer">
                                    <i class="fa-solid fa-stopwatch"></i>
                                    <span>${step.timerMinutes}分</span>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updateProgress(completedCount, templates.length);
        }

        function toggleStep(stepId) {
            const dateVal = document.getElementById('work-date').value;
            if (!dailyProgress[dateVal]) dailyProgress[dateVal] = {};
            dailyProgress[dateVal][stepId] = !dailyProgress[dateVal][stepId];
            localStorage.setItem('kimbap_daily_progress', JSON.stringify(dailyProgress));
            renderExecution();
        }

        function updateProgress(completed, total) {
            const text = document.getElementById('progress-text');
            const bar = document.getElementById('progress-bar');
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            text.innerText = `${completed} / ${total} (${percent}%)`;
            bar.style.width = `${percent}%`;
        }

        function resetTodayProgress() {
            const dateVal = document.getElementById('work-date').value;
            if (dailyProgress[dateVal]) {
                dailyProgress[dateVal] = {};
                localStorage.setItem('kimbap_daily_progress', JSON.stringify(dailyProgress));
                renderExecution();
            }
        }

        // 步驟設定管理
        function renderTemplates() {
            const container = document.getElementById('templates-list');
            if (templates.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400">尚無自訂步驟</div>`;
                return;
            }

            let html = '';
            templates.forEach((step, index) => {
                const colorClass = categoryColors[step.category] || categoryColors['其他'];
                html += `
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center justify-between gap-3">
                        <div class="flex items-center space-x-2 flex-wrap">
                            <span class="text-xs font-bold px-2 py-0.5 rounded-md border ${colorClass}">${step.category}</span>
                            <span class="text-sm font-bold text-slate-700">${step.title}</span>
                            ${step.timerMinutes > 0 ? `<span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-md font-medium"><i class="fa-solid fa-stopwatch mr-1"></i>${step.timerMinutes}分鐘</span>` : ''}
                        </div>
                        <button onclick="deleteTemplate('${step.id}')" class="text-slate-400 hover:text-red-500 p-1.5 transition">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function addStep(e) {
            e.preventDefault();
            const title = document.getElementById('new-title').value;
            const category = document.getElementById('new-category').value;
            const timerMinutes = parseInt(document.getElementById('new-timer').value) || 0;
            const desc = document.getElementById('new-desc').value;

            const newStep = {
                id: Date.now().toString(),
                title,
                category,
                timerMinutes,
                desc
            };

            templates.push(newStep);
            localStorage.setItem('kimbap_templates', JSON.stringify(templates));
            
            document.getElementById('new-title').value = '';
            document.getElementById('new-timer').value = '';
            document.getElementById('new-desc').value = '';
            
            renderTemplates();
            renderExecution();
        }

        function deleteTemplate(id) {
            templates = templates.filter(t => t.id !== id);
            localStorage.setItem('kimbap_templates', JSON.stringify(templates));
            renderTemplates();
            renderExecution();
        }

        // 計時器邏輯
        function startTimer(stepId, title, minutes) {
            const totalSeconds = minutes * 60;
            const timerObj = {
                id: Date.now() + Math.random(),
                title: title,
                remainingSeconds: totalSeconds,
                totalSeconds: totalSeconds
            };
            activeTimers.push(timerObj);
            updateTimersDisplay();
        }

        function cancelTimer(id) {
            activeTimers = activeTimers.filter(t => t.id !== id);
            updateTimersDisplay();
        }

        function updateTimersDisplay() {
            const container = document.getElementById('timers-container');
            const list = document.getElementById('running-timers-list');
            const countLabel = document.getElementById('active-timer-count');

            if (activeTimers.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            countLabel.innerText = `${activeTimers.length} 個計時中`;

            let html = '';
            activeTimers.forEach(timer => {
                const m = Math.floor(timer.remainingSeconds / 60);
                const s = timer.remainingSeconds % 60;
                const timeStr = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                
                html += `
                    <div class="bg-amber-800 border border-amber-700 rounded-xl px-3 py-1.5 flex items-center space-x-3 text-xs shadow-sm">
                        <div>
                            <span class="font-bold text-amber-200 block">${timer.title}</span>
                            <span class="text-sm font-mono font-bold text-white">${timeStr}</span>
                        </div>
                        <button onclick="cancelTimer(${timer.id})" class="text-amber-300 hover:text-white p-1">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        // 每秒倒數計時核心
        setInterval(() => {
            if (activeTimers.length === 0) return;

            let finishedTimerTitle = null;
            activeTimers.forEach(timer => {
                timer.remainingSeconds--;
                if (timer.remainingSeconds <= 0) {
                    finishedTimerTitle = timer.title;
                }
            });

            if (finishedTimerTitle) {
                // 移除第一個到期的計時器
                const finished = activeTimers.find(t => t.remainingSeconds <= 0);
                if (finished) {
                    activeTimers = activeTimers.filter(t => t.id !== finished.id);
                    triggerAlarm(finished.title);
                }
            }

            updateTimersDisplay();
        }, 1000);

        function triggerAlarm(title) {
            document.getElementById('alarm-message').innerText = `「${title}」時間到！請注意鍋況或進行下一步！`;
            document.getElementById('alarm-modal').classList.remove('hidden');
            // 震動通知 (支援行動裝置)
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }

        function dismissAlarm() {
            document.getElementById('alarm-modal').classList.add('hidden');
        }

        // 資料匯出備份
        function exportData() {
            const backupData = {
                templates: templates,
                dailyProgress: dailyProgress,
                exportDate: new Date().toISOString()
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `kimbap_backup_${todayStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // 資料匯入還原
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.templates && parsed.dailyProgress) {
                        templates = parsed.templates;
                        dailyProgress = parsed.dailyProgress;
                        localStorage.setItem('kimbap_templates', JSON.stringify(templates));
                        localStorage.setItem('kimbap_daily_progress', JSON.stringify(dailyProgress));
                        renderExecution();
                        renderTemplates();
                        alert('備份資料還原成功！');
                    } else {
                        alert('檔案格式錯誤，找不到有效的備份結構。');
                    }
                } catch (err) {
                    alert('解析備份檔案失敗，請確認檔案格式是否正確。');
                }
                event.target.value = ''; // 清空 input 讓重複檔案可再觸發
            };
            reader.readAsText(file);
        }

        // 初次載入渲染
        renderExecution();
    </script>
</body>
</html>
